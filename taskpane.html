<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Финансовый агент</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
html, body { height: 100%; margin: 0; }
body { display: flex; }
#pane-host { flex: 1; display: flex; min-height: 0; }
#pane-host > .pane { flex: 1; }
/* Панель Финансового агента.
   Один и тот же файл используют надстройка Excel и запасной .html —
   поэтому здесь нет ничего, что зависит от окружения. */

:root {
  --xl-green:      #107C41;
  --xl-green-dk:   #0B6031;
  --xl-green-lt:   #EAF4EE;
  --chrome:        #F3F2F1;
  --chrome-2:      #FAF9F8;
  --line:          #D2D0CE;
  --line-soft:     #E7E5E3;
  --ink:           #1B1A19;
  --ink-2:         #484644;
  --muted:         #797775;
  --muted-2:       #A19F9D;
  --crit:          #A4262C;
  --crit-bg:       #FDF3F4;
  --crit-line:     #F1C7C9;
  --warn:          #8A5300;
  --warn-bg:       #FFF8EC;
  --warn-line:     #F0DCB4;
  --info:          #1B5FA8;
  --info-bg:       #F0F6FC;
  --info-line:     #C7DCF1;

  --ui: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
  --cell: Calibri, "Segoe UI", -apple-system, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--xl-green); outline-offset: 1px; }

.pane {
  background: #fff;
  color: var(--ink);
  font-family: var(--ui);
  font-size: 13px;
  display: flex;
  flex-direction: column;
  min-height: 0;
  height: 100%;
}

/* ── шапка ── */
.pane-head {
  padding: 11px 12px 11px 14px;
  border-bottom: 1px solid var(--line-soft);
  display: flex; align-items: center; gap: 10px; flex: none;
}
.pane-head .mark {
  width: 28px; height: 28px; border-radius: 6px; flex: none;
  background: linear-gradient(150deg, #1a9a55, var(--xl-green-dk));
  display: grid; place-items: center;
}
.pane-head .mark svg { width: 16px; height: 16px; stroke: #fff; fill: none; stroke-width: 1.7;
                       stroke-linecap: round; stroke-linejoin: round; }
.pane-head .ttl { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.pane-head .ttl b { font-size: 13.5px; font-weight: 600; letter-spacing: -.005em; }
.pane-head .ttl span { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pane-head .acts { margin-left: auto; display: flex; gap: 2px; }
.iconbtn {
  width: 26px; height: 26px; border: none; background: none; border-radius: 4px;
  display: grid; place-items: center; cursor: pointer;
}
.iconbtn:hover { background: var(--chrome); }
.iconbtn svg { width: 15px; height: 15px; stroke: var(--muted); fill: none; stroke-width: 1.6;
               stroke-linecap: round; stroke-linejoin: round; }
.iconbtn.on { background: var(--xl-green-lt); }
.iconbtn.on svg { stroke: var(--xl-green); }

/* ── состояние проверки ── */
.pane-scan { padding: 8px 14px 9px; border-bottom: 1px solid var(--line-soft); flex: none; }
.pane-scan .line { display: flex; align-items: center; gap: 8px; }
.pane-scan:not(.ok) .line { margin-bottom: 7px; }
.pane-scan .txt { font-size: 11.5px; color: var(--ink-2); }
.pane-scan .txt b { font-weight: 600; color: var(--ink); }
.spin {
  width: 12px; height: 12px; flex: none; border-radius: 50%;
  border: 1.8px solid var(--line-soft); border-top-color: var(--xl-green);
  animation: spin .7s linear infinite;
}
.pane-scan.ok .spin {
  border: none; background: var(--xl-green); animation: none;
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M3 8.5l3.4 3.4L13 5' fill='none' stroke='black' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/12px no-repeat;
          mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M3 8.5l3.4 3.4L13 5' fill='none' stroke='black' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/12px no-repeat;
}
@keyframes spin { to { transform: rotate(360deg); } }
.bar { height: 4px; background: #EDEBE9; border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 3px;
         background: linear-gradient(90deg, #2FA35F, var(--xl-green)); transition: width .16s linear; }
.pane-scan.ok .bar { display: none; }

/* ── чипы итога ── */
.pane-sum { display: flex; gap: 6px; padding: 9px 14px 10px; flex: none; flex-wrap: wrap; }
.stat {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line-soft); border-radius: 13px;
  padding: 4px 11px 4px 8px; background: #fff; font-size: 11.5px; color: var(--ink-2);
}
.stat .v { font-weight: 700; font-variant-numeric: tabular-nums; }
.stat i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted-2); }
.stat.c { border-color: var(--crit-line); background: var(--crit-bg); color: #7E3238; }
.stat.c i { background: var(--crit); }
.stat.w { border-color: var(--warn-line); background: var(--warn-bg); color: #74521A; }
.stat.w i { background: #D89A2B; }

/* ── вкладки панели ── */
.tabs2 { display: flex; gap: 2px; padding: 0 10px; border-bottom: 1px solid var(--line-soft); flex: none; }
.tabs2 button {
  background: none; border: none; border-bottom: 2px solid transparent;
  padding: 8px 10px; font-size: 12px; color: var(--muted); cursor: pointer;
}
.tabs2 button:hover { color: var(--ink); }
.tabs2 button.on { color: var(--xl-green); border-bottom-color: var(--xl-green); font-weight: 600; }
.tabs2 .badge {
  display: inline-block; min-width: 16px; margin-left: 5px; padding: 0 4px;
  background: var(--chrome); border-radius: 8px; font-size: 10px; color: var(--ink-2);
}

.sect-h {
  padding: 9px 14px 6px;
  display: flex; align-items: baseline; gap: 8px;
  font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted-2);
  flex: none;
}
.sect-h .n { margin-left: auto; letter-spacing: 0; font-size: 11px; text-transform: none; }

/* ── список находок ── */
.flist { flex: 0 1 auto; overflow-y: auto; min-height: 100px; max-height: 34%; border-top: 1px solid var(--line-soft); }
.fitem {
  width: 100%; text-align: left; background: none; border: none;
  border-bottom: 1px solid var(--line-soft); border-left: 3px solid transparent;
  padding: 10px 12px 10px 11px; cursor: pointer; display: flex; gap: 9px; align-items: flex-start;
}
.fitem:hover { background: var(--chrome-2); }
.fitem[aria-pressed="true"] { background: var(--xl-green-lt); border-left-color: var(--xl-green); }
.fitem .sev { width: 8px; height: 8px; border-radius: 50%; flex: none; margin-top: 4px; }
.fitem.crit .sev { background: var(--crit); }
.fitem.warn .sev { background: #D89A2B; }
.fitem .body { min-width: 0; display: flex; flex-direction: column; gap: 3px; flex: 1; }
.fitem .t { font-size: 12.5px; font-weight: 600; line-height: 1.3; }
.fitem .f { font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.fitem .cellref {
  flex: none; align-self: flex-start; font-family: var(--cell); font-size: 11px; color: var(--muted);
  background: var(--chrome); border: 1px solid var(--line-soft); border-radius: 3px; padding: 1px 5px;
}

/* ── разбор находки ── */
.detail {
  flex: 1 1 auto; overflow-y: auto; min-height: 0;
  border-top: 1px solid var(--line); background: var(--chrome-2);
  padding: 12px 14px 0; display: flex; flex-direction: column; gap: 11px;
}
.detail .dh { display: flex; flex-direction: column; gap: 6px; }
.detail h3 { margin: 0; font-size: 14.5px; font-weight: 600; line-height: 1.3; letter-spacing: -.01em; }
.pill {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 5px;
  font-size: 10px; text-transform: uppercase; letter-spacing: .07em; font-weight: 600;
  padding: 3px 8px; border-radius: 11px; border: 1px solid;
}
.pill.crit { color: var(--crit); background: var(--crit-bg); border-color: var(--crit-line); }
.pill.warn { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-line); }
.pill.ai   { color: var(--info); background: var(--info-bg); border-color: var(--info-line); }

.card { background: #fff; border: 1px solid var(--line-soft); border-radius: 6px; box-shadow: 0 1px 1px rgba(0,0,0,.03); }
.why { padding: 11px 13px; border-left: 3px solid var(--xl-green); border-radius: 6px; }
.why.ai { border-left-color: var(--info); }
.why em {
  display: flex; align-items: center; gap: 6px; font-style: normal;
  font-size: 9.5px; text-transform: uppercase; letter-spacing: .09em;
  color: var(--xl-green); font-weight: 700; margin-bottom: 6px;
}
.why.ai em { color: var(--info); }
.why em svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.why p { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--ink-2); }
.why p + p { margin-top: 8px; }

.kv { padding: 3px 13px; }
.kv > div { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 12.5px; }
.kv > div:last-child { border-bottom: none; }
.kv .k { color: var(--muted); white-space: nowrap; }
.kv .v { margin-left: auto; font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }

.srcline { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--muted); line-height: 1.45; }
.srcline svg { width: 13px; height: 13px; flex: none; stroke: var(--muted-2); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.srcline b { font-family: var(--cell); font-weight: 600; color: var(--ink-2); }

.dacts {
  display: flex; gap: 8px; position: sticky; bottom: 0;
  margin: auto -14px 0; padding: 10px 14px;
  background: linear-gradient(180deg, rgba(250,249,248,0), var(--chrome-2) 45%);
}
.btn {
  flex: 1; border-radius: 4px; padding: 7px 10px; font-size: 12px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
}
.btn svg { width: 14px; height: 14px; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.btn.pri { background: var(--xl-green); color: #fff; border: 1px solid var(--xl-green); font-weight: 600; }
.btn.pri svg { stroke: #fff; }
.btn.pri:hover { background: var(--xl-green-dk); border-color: var(--xl-green-dk); }
.btn.sec { background: #fff; border: 1px solid #C8C6C4; }
.btn.sec svg { stroke: var(--ink-2); }
.btn.sec:hover { background: var(--chrome); }
.btn[disabled] { opacity: .5; cursor: default; }

/* ── что не проверялось ── */
.skips { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.skip {
  border: 1px solid var(--line-soft); border-radius: 6px; padding: 9px 11px;
  background: #fff; font-size: 12px; color: var(--ink-2); line-height: 1.45;
}
.skip b { display: block; font-weight: 600; color: var(--ink); margin-bottom: 2px; font-size: 12.5px; }
.skip.clean { background: var(--chrome-2); color: var(--muted); }
.skip.clean b { color: var(--ink-2); }

/* ── мастер колонок ── */
.wizard { padding: 0 14px 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
.wsheet { border: 1px solid var(--line-soft); border-radius: 7px; overflow: hidden; }
.wsheet > header {
  padding: 9px 11px; background: var(--chrome-2); border-bottom: 1px solid var(--line-soft);
  display: flex; align-items: center; gap: 8px;
}
.wsheet > header b { font-size: 12.5px; font-weight: 600; }
.wsheet > header .kind { margin-left: auto; }
.wsheet .rows { padding: 4px 11px 10px; }
.wrow { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dotted var(--line-soft); }
.wrow:last-child { border-bottom: none; }
.wrow label { font-size: 12px; color: var(--ink-2); min-width: 116px; }
select, input[type="number"], input[type="text"], input[type="password"] {
  font: inherit; font-size: 12px; padding: 4px 6px;
  border: 1px solid #C8C6C4; border-radius: 3px; background: #fff; color: var(--ink);
  max-width: 100%;
}
select { flex: 1; min-width: 0; }
select:focus, input:focus { border-color: var(--xl-green); outline: none; }
.wrow .guess { font-size: 10.5px; color: var(--muted-2); white-space: nowrap; }

/* ── настройки ── */
.settings { padding: 4px 14px 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.field .hint { font-size: 11px; color: var(--muted); line-height: 1.45; }
.field .row { display: flex; gap: 8px; align-items: center; }
.field input[type="number"] { width: 92px; }
.field input[type="password"], .field input[type="text"] { width: 100%; }

/* ── агент ── */
.chat { flex: 1 1 auto; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; min-height: 0; background: var(--chrome-2); }
.msg { display: flex; flex-direction: column; gap: 4px; max-width: 100%; }
.msg .who { font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted-2); }
.msg .txt { font-size: 12.5px; line-height: 1.55; padding: 9px 11px; border-radius: 7px; background: #fff; border: 1px solid var(--line-soft); white-space: pre-wrap; }
.msg.me .txt { background: var(--xl-green-lt); border-color: #CBE4D6; }
.msg .tool {
  font-size: 11px; color: var(--muted); font-family: var(--cell);
  background: #fff; border: 1px dashed var(--line); border-radius: 6px; padding: 6px 9px;
}
.msg .tool b { color: var(--ink-2); font-weight: 600; }
.chatbar { flex: none; border-top: 1px solid var(--line-soft); padding: 10px 12px; display: flex; gap: 8px; background: #fff; }
.chatbar input { flex: 1; }
.chatbar button { flex: none; }

/* ── пустые состояния ── */
.empty {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; color: var(--muted); font-size: 12.5px; text-align: center; padding: 26px 22px;
}
.empty svg { width: 36px; height: 36px; stroke: #C8C6C4; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.empty b { color: var(--ink-2); font-size: 13px; }

.pane-foot {
  border-top: 1px solid var(--line-soft); padding: 7px 14px;
  font-size: 10.5px; color: var(--muted-2); line-height: 1.45;
  flex: none; display: flex; align-items: center; gap: 7px;
}
.pane-foot svg { width: 13px; height: 13px; flex: none; stroke: var(--muted-2); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.pane-foot span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

</style>
</head>
